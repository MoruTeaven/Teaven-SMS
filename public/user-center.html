            <div class="balance-meta">
              <span><i class="ri-arrow-up-line"></i> 累计充值 ¥${(stats.totalRecharge || 0).toFixed(2)}</span>
              <span><i class="ri-arrow-down-line"></i> 累计消费 ¥${Math.abs(stats.totalCharge || 0).toFixed(2)}</span>
            </div>
            <div class="balance-actions"><button class="btn" id="rechargeBtn2"><i class="ri-wallet-3-line"></i> 立即充值</button></div>
          </div>
          <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px">
            <div class="card card-pad"><div class="stat-label">累计充值</div><div class="stat-value num" style="color:var(--success); font-size:22px">¥${(stats.totalRecharge || 0).toFixed(2)}</div></div>
            <div class="card card-pad"><div class="stat-label">累计消费</div><div class="stat-value num" style="color:var(--error); font-size:22px">¥${Math.abs(stats.totalCharge || 0).toFixed(2)}</div></div>
            <div class="card card-pad"><div class="stat-label">累计退款</div><div class="stat-value num" style="color:var(--info); font-size:22px">¥${(stats.totalRefund || 0).toFixed(2)}</div></div>
            <div class="card card-pad"><div class="stat-label">7 日消费</div><div class="stat-value num" style="font-size:22px">¥${(stats.weekCost || 0).toFixed(2)}</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header" style="flex-wrap:wrap">
            <div class="tabs" id="billTabs" style="margin:0; border:none">
              <div class="tab ${state.type==='all'?'active':''}" data-type="all">全部</div>
              <div class="tab ${state.type==='charge'?'active':''}" data-type="charge">消费</div>
              <div class="tab ${state.type==='recharge'?'active':''}" data-type="recharge">充值</div>
              <div class="tab ${state.type==='refund'?'active':''}" data-type="refund">退款</div>
            </div>
            <div class="chip"><i class="ri-list-check"></i> 共 ${total} 条</div>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>流水 ID</th><th>类型</th><th class="num">金额</th><th class="num">余额</th><th>备注</th><th>时间</th></tr></thead>
              <tbody>
                ${items.length === 0 ? `<tr><td colspan="6"><div class="empty"><i class="ri-inbox-line"></i>暂无流水记录</div></td></tr>` :
                  items.map(t => `<tr>
                    <td class="mono" style="font-size:11px">${window.TS.fmt.esc(t.id)}</td>
                    <td><span class="badge ${sm[t.type]?.cls || 'neutral'}">${sm[t.type]?.label || t.type}</span></td>
                    <td class="num" style="color:${parseFloat(t.amount)>0?'var(--success)':'var(--error)'}; font-weight:600">${parseFloat(t.amount)>0?'+':''}${window.TS.fmt.signed(t.amount)}</td>
                    <td class="num">¥${parseFloat(t.balance_after || '0').toFixed(4).replace(/\.?0+$/, m=>m.includes(".")?m:"")}</td>
                    <td style="color:var(--text-secondary)">${window.TS.fmt.esc(t.remark || '—')}</td>
                    <td style="color:var(--text-muted); font-size:12px">${window.TS.fmt.date(t.created_at)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          ${total > 0 ? `<div style="padding:12px 16px"><div class="pagination">
            <div class="pagination-info">第 ${start+1}-${Math.min(start+pageSize, total)} 条 / 共 ${total} 条</div>
            <div class="pagination-controls">
              <button class="page-btn" ${page===1?'disabled':''} id="billPrev"><i class="ri-arrow-left-s-line"></i></button>
              ${Array.from({length: totalPages}, (_, i) => i+1).filter(p => Math.abs(p - page) < 3 || p === 1 || p === totalPages).map((p, i, arr) => {
                if (i > 0 && arr[i-1] !== p-1) return `<span style="color:var(--text-muted); padding:0 4px">…</span><button class="page-btn ${p===page?'active':''}" data-page="${p}">${p}</button>`;
                return `<button class="page-btn ${p===page?'active':''}" data-page="${p}">${p}</button>`;
              }).join('')}
              <button class="page-btn" ${page===totalPages?'disabled':''} id="billNext"><i class="ri-arrow-right-s-line"></i></button>
            </div>
          </div></div>` : ''}
        </div>
      `;

      document.querySelectorAll('#billTabs .tab').forEach(t => t.onclick = () => { state.type = t.dataset.type; state.page = 1; render(); });
      const billPrev = document.getElementById('billPrev');
      const billNext = document.getElementById('billNext');
      if (billPrev) billPrev.onclick = () => { if (state.page > 1) { state.page--; render(); } };
      if (billNext) billNext.onclick = () => { state.page++; render(); };
      document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { state.page = +b.dataset.page; render(); });

      const openRecharge = () => {
        window.TS.modal({
          title: '账户充值',
          body: `
            <div class="form-group">
              <label class="form-label">充值金额<span class="req">*</span></label>
              <div class="input-group"><input class="input" id="rechargeAmount" type="number" placeholder="请输入金额" value="500" /><span class="input-suffix">元</span></div>
              <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap">
                <button class="btn btn-sm" data-amt="100">¥100</button>
                <button class="btn btn-sm" data-amt="500">¥500</button>
                <button class="btn btn-sm" data-amt="1000">¥1,000</button>
                <button class="btn btn-sm" data-amt="5000">¥5,000</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">支付方式</label>
              <div class="radio-row inline">
                <label class="radio-item"><input type="radio" name="pay" checked /> 支付宝</label>
                <label class="radio-item"><input type="radio" name="pay" /> 微信支付</label>
                <label class="radio-item"><input type="radio" name="pay" /> 对公转账</label>
              </div>
            </div>
            <div class="notice info"><i class="ri-information-line"></i><div>充值金额实时到账。</div></div>
          `,
          foot: `<button class="btn" data-close>取消</button><button class="btn btn-primary" id="confirmRecharge"><i class="ri-check-line"></i> 确认充值</button>`
        });
        document.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => { document.getElementById('rechargeAmount').value = b.dataset.amt; });
        document.getElementById('confirmRecharge').onclick = async () => {
          const amt = parseFloat(document.getElementById('rechargeAmount').value);
          if (!amt || amt <= 0) { window.TS.toast('error', '金额无效', '请输入正确的充值金额'); return; }
          const method = document.querySelector('input[name="pay"]:checked')?.parentElement?.textContent?.trim() || '支付宝';
          try {
            const result = await window.TS.api.post('/user/recharge', { amount: amt, method });
            document.querySelector('.modal .icon-btn[data-close]')?.click();
            window.TS.toast('success', '充值成功', `已充值 ¥${amt.toFixed(2)}，余额更新为 ¥${parseFloat(result.balance).toFixed(2)}`);
            window.TS.data.invalidate(['stats', 'transactions']);
            await window.TS.data.refreshAuthUser();
            render();
          } catch (err) { window.TS.toast('error', '充值失败', err.message); }
        };
      };
      document.getElementById('rechargeBtn').onclick = openRecharge;
      document.getElementById('rechargeBtn2').onclick = openRecharge;
    } catch (e) { window.TS.errorBox(host, e.message); }
  };

  await render();
};

/* ---------- 个人设置 ---------- */
window.TS.pages.settings = async function(host) {
  const u = window.TS.auth.user;
  const balance = parseFloat(u.balance || '0');
  const name = (u.email || 'U').split('@')[0];

  host.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">个人设置</div><div class="page-subtitle">管理账户安全与基本信息</div></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-header"><div><div class="card-title">账户信息</div><div class="card-sub">基本信息与联系方式</div></div></div>
        <div class="card-pad">
          <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px">
            <div class="avatar" style="width:56px; height:56px; font-size:22px">${name.charAt(0).toUpperCase()}</div>
            <div>
              <div style="font-size:16px; font-weight:600">${window.TS.fmt.esc(name)}</div>
              <div style="font-size:12px; color:var(--text-muted)">${window.TS.fmt.esc(u.email)}</div>
            </div>
          </div>
          <div class="kv"><div class="kv-k">用户 ID</div><div class="kv-v mono" style="font-size:11px">${window.TS.fmt.esc(u.id)}</div></div>
          <div class="kv"><div class="kv-k">邮箱</div><div class="kv-v">${window.TS.fmt.esc(u.email)}</div></div>
          <div class="kv"><div class="kv-k">角色</div><div class="kv-v">${u.role === 'admin' ? '管理员' : '普通用户'}</div></div>
          <div class="kv"><div class="kv-k">状态</div><div class="kv-v"><span class="badge success">${u.status === 'active' ? '正常' : u.status}</span></div></div>
          <div class="kv"><div class="kv-k">余额</div><div class="kv-v num" style="font-weight:600">¥${balance.toFixed(2)}</div></div>
          <div class="kv"><div class="kv-k">注册时间</div><div class="kv-v">${window.TS.fmt.date(u.created_at)}</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div><div class="card-title">修改密码</div><div class="card-sub">建议定期更换以保障账户安全</div></div></div>
        <div class="card-pad">
          <div class="form-group">
            <label class="form-label">当前密码<span class="req">*</span></label>
            <input class="input" type="password" id="oldPwd" placeholder="请输入当前密码" />
            <div class="form-error">请输入当前密码</div>
          </div>
          <div class="form-group">
            <label class="form-label">新密码<span class="req">*</span></label>
            <input class="input" type="password" id="newPwd" placeholder="至少 8 位" />
            <div class="form-help">至少 8 位</div>
            <div class="form-error">密码需至少 8 位</div>
          </div>
          <div class="form-group">
            <label class="form-label">确认新密码<span class="req">*</span></label>
            <input class="input" type="password" id="confirmPwd" placeholder="再次输入新密码" />
            <div class="form-error">两次密码不一致</div>
          </div>
          <button class="btn btn-primary" id="changePwd"><i class="ri-lock-line"></i> 更新密码</button>
        </div>
      </div>

      <div class="card" style="grid-column:1/-1">
        <div class="card-header"><div><div class="card-title">API 接入信息</div><div class="card-sub">调用 SMS API 所需的认证信息</div></div></div>
        <div class="card-pad">
          <div class="notice info"><i class="ri-information-line"></i><div>调用 API 需使用 AccessKey + Secret 计算 HMAC-SHA256 签名。请在 <a href="#/api-keys" style="color:var(--brand-500)">API Key 管理</a> 创建密钥。</div></div>
          <div class="kv" style="margin-top:12px"><div class="kv-k">API 地址</div><div class="kv-v mono">/api/sms/send</div></div>
          <div class="kv"><div class="kv-k">认证方式</div><div class="kv-v">HMAC-SHA256 签名</div></div>
          <div class="kv"><div class="kv-k">请求头</div><div class="kv-v mono" style="font-size:11px">X-Access-Key, X-Timestamp, X-Nonce, X-Signature</div></div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('changePwd').onclick = async () => {
    const oldP = document.getElementById('oldPwd').value;
    const newP = document.getElementById('newPwd').value;
    const conP = document.getElementById('confirmPwd').value;
    let ok = true;
    const oldG = document.getElementById('oldPwd').parentElement;
    const newG = document.getElementById('newPwd').parentElement;
    const conG = document.getElementById('confirmPwd').parentElement;
    [oldG, newG, conG].forEach(g => g.classList.remove('has-error'));
    if (!oldP) { oldG.classList.add('has-error'); ok = false; }
    if (newP.length < 8) { newG.classList.add('has-error'); ok = false; }
    if (newP !== conP) { conG.classList.add('has-error'); ok = false; }
    if (!ok) return;
    const btn = document.getElementById('changePwd');
    btn.disabled = true;
    try {
      await window.TS.api.put('/user/password', { oldPassword: oldP, newPassword: newP });
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
      window.TS.toast('success', '密码已更新', '下次登录请使用新密码');
    } catch (err) {
      window.TS.toast('error', '更新失败', err.message);
    }
    btn.disabled = false;
  };
};

/* ============================================================
   应用初始化
   ============================================================ */
window.TS.app = {
  init() {
    // 主题
    window.TS.theme.init();

    // 数据预加载与聚焦刷新
    window.TS.data.preload();
    window.TS.autoRefresh.init();

    // 折叠侧边栏
    document.getElementById('collapseBtn').onclick = () => {
      if (window.innerWidth < 1024) {
        document.getElementById('aside').classList.toggle('mobile-open');
        document.getElementById('scrim').classList.toggle('show');
      } else {
        document.getElementById('aside').classList.toggle('collapsed');
      }
    };

    // 汉堡菜单
    document.getElementById('hamburger').onclick = () => {
      document.getElementById('aside').classList.toggle('mobile-open');
      document.getElementById('scrim').classList.toggle('show');
    };
    document.getElementById('scrim').onclick = () => {
      document.getElementById('aside').classList.remove('mobile-open');
      document.getElementById('scrim').classList.remove('show');
    };

    // 导航点击
    window.TS.$$('.nav-item').forEach(n => n.onclick = () => window.TS.router.go(n.dataset.route));

    // 主题下拉
    const themeDropdown = document.getElementById('themeDropdown');
    document.getElementById('themeBtn').onclick = (e) => {
      e.stopPropagation();
      themeDropdown.classList.toggle('open');
      document.getElementById('userDropdown').classList.remove('open');
    };
    themeDropdown.querySelectorAll('[data-theme-set]').forEach(it => it.onclick = () => {
      window.TS.theme.set(it.dataset.themeSet);
      themeDropdown.classList.remove('open');
    });

    // 用户下拉
    const userDropdown = document.getElementById('userDropdown');
    userDropdown.querySelector('button').onclick = (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('open');
      themeDropdown.classList.remove('open');
    };
    userDropdown.querySelectorAll('.dropdown-item[data-route]').forEach(it => it.onclick = () => {
      window.TS.router.go(it.dataset.route);
      userDropdown.classList.remove('open');
    });
    document.getElementById('logoutBtn').onclick = () => {
      userDropdown.classList.remove('open');
      window.TS.modal({
        title: '确认退出登录',
        body: `<div class="notice warning"><i class="ri-alert-line"></i><div>退出后需重新登录才能继续使用 Teaven SMS 用户中心。</div></div>`,
        foot: `<button class="btn" data-close>取消</button><button class="btn btn-danger" id="confirmLogout">确认退出</button>`
      });
      document.getElementById('confirmLogout').onclick = () => {
        document.querySelector('.modal .icon-btn[data-close]')?.click();
        window.TS.auth.logout();
      };
    };

    // 点击外部关闭下拉
    document.addEventListener('click', (e) => {
      if (!themeDropdown.contains(e.target)) themeDropdown.classList.remove('open');
      if (!userDropdown.contains(e.target)) userDropdown.classList.remove('open');
    });

    // 用户菜单（侧边栏）
    document.getElementById('userMini').onclick = () => window.TS.router.go('#/settings');

    // 路由
    window.TS.router.init();
  }
};

/* ---------- 启动 ---------- */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    window.TS.auth.bindLogin();
    window.TS.auth.init();
  });
} else {
  window.TS.auth.bindLogin();
  window.TS.auth.init();
}

</script>
</body>
</html>
